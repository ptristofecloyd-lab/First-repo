<button id="myButton" class="my-button">-</button>

    <script>

        const myButton = document.getElementById('myButton');
        const myHeading = document.getElementById('myHeading');
        const myButton2 = document.getElementById('myButton2');

        let value = 0;

        myButton.addEventListener('click', () => {
            value--;
            myHeading.textContent = value;
        });

        myButton2.addEventListener('click', () => {
            value++;
            myHeading.textContent = value;
        });

        const redButton = document.getElementById('redButton');
        const blueButton = document.getElementById('blueButton');
        const greenButton = document.getElementById('greenButton');

        redButton.addEventListener('click', () => {
            document.body.style.backgroundColor = 'red';
        });

        blueButton.addEventListener('click', () => {
            document.body.style.backgroundColor = 'blue';
        });

        greenButton.addEventListener('click', () => {
            document.body.style.backgroundColor = 'green';
        });

        const myInput = document.getElementById('myInput');
        const myResult = document.getElementById('myResult');
        const myButton4 = document.getElementById('myButton4');

        myButton4.addEventListener('click', () => {
            const year = parseInt(myInput.value);
            if (!isNaN(year)) {
                const currentYear = new Date().getFullYear();
                const age = currentYear - year;
                myResult.textContent = ` ${age}`;
            } else {
                myResult.textContent = 'Please enter a valid year.';
            }
        });
    </script>
